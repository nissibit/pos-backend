version: '3.8'

# Sobrescreve as configurações de desenvolvimento
services:
  # Sobrescreve a configuração do backend
  pos-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev # <--- Aponta para a imagem de dev com Node/NPM
    image: pos-backend:dev # <--- Tag de dev para diferenciar
    volumes:
      # Mapeamento CRÍTICO para desenvolvimento
      # Seu código local está instantaneamente disponível dentro do container
      - .:/var/www/html:cached
    depends_on:
      pos-mysql:
        condition: service_healthy

  # Sobrescreve a configuração do Nginx
  app_nginx:
    volumes:
      # Mapeamento do código também no Nginx
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8081:80" # Porta de dev