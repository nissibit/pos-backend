services:

  pos-backend:
    build: .
    container_name: pos-backend
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - pos
    volumes:
      # Persistência de storage
      - storage:/var/www/html/storage
      # Arquivo .env de produção
      - ./prod.env:/var/www/html/.env:ro

  nginx:
    image: nginx:latest
    container_name: pos-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pos-backend
    networks:
      - pos

volumes:
  storage:

networks:
  pos:
