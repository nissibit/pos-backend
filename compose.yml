services:
  pos-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-backend
    image: pos-backend
    volumes:
      - .:/var/www/html
    networks:
      - devnet

  pos-nginx:
    image: nginx:alpine
    container_name: pos-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pos-backend
    networks:
      - devnet

networks:
  devnet:
    driver: bridge
